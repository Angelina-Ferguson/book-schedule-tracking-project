services:
  server:
    build:
      context: .
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODEMON_LEGACY_WATCH=true
    develop:
      watch:
        - action: sync
          path: ./
          target: /src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      - "MYSQL_ROOT_PASSWORD=R00t"   


      
  